plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.plantaloon'
version = '1.0.0'

android {
  namespace "org.plantaloon.scanner"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Runs the plant-recognition model on the phone (MIT licence).
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.0'
}
